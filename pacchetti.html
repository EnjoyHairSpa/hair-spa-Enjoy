<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacchetti - Hair Spa</title>
    <link rel="stylesheet" href="dark-luxury.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Card pacchetto (elenco) */
        .pack-card {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 15px;
            margin-bottom: 18px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.3s, transform 0.3s;
        }
        .pack-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        .pack-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            background: linear-gradient(135deg, #222, #0d0d0d);
        }
        .pack-img-placeholder {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 6px;
            font-weight: 200;
            background: linear-gradient(135deg, #222, #0d0d0d);
        }
        .pack-body { padding: 18px; }
        .pack-name { color: #fff; font-size: 1.1rem; font-weight: 300; letter-spacing: 2px; margin: 0 0 6px 0; }
        .pack-price { color: var(--gold); font-size: 1rem; letter-spacing: 1px; }
        .pack-sessions { color: #777; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-left: 10px; }

        /* Dettaglio */
        .detail-desc { color: #bbb; font-size: 0.9rem; line-height: 1.5; text-align: center; margin: 15px 0 25px; }
        .service-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #eee;
            font-size: 0.95rem;
        }
        .service-qty { color: var(--gold); font-weight: bold; }
        .input-luxury {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            margin-top: 5px;
            box-sizing: border-box;
        }
        .input-luxury:focus { border-color: var(--gold); outline: none; }
        .textarea-luxury {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 12px;
            color: #eee;
            padding: 15px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            margin-top: 8px;
        }
        .textarea-luxury:focus { outline: none; border-color: var(--gold); }
        .back-link {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0;
            margin-bottom: 15px;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="dark-page">

    <div class="form-container">
        <nav class="top-nav" style="position: relative; padding: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <a href="index.html" class="btn-back">Indietro</a>
            <div id="welcome-user-top" style="font-size: 0.7rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px;"></div>
        </nav>

        <!-- VISTA ELENCO -->
        <div id="vista-lista">
            <h1 class="page-title" style="margin-top: 10px; margin-bottom: 25px; font-weight: 200; letter-spacing: 6px;">PACCHETTI</h1>
            <div id="elenco-pacchetti">
                <p style="color: white; opacity: 0.5; text-align: center; font-size: 0.8rem;">Caricamento pacchetti...</p>
            </div>
        </div>

        <!-- VISTA DETTAGLIO -->
        <div id="vista-dettaglio" class="hidden">
            <button type="button" id="btnTornaElenco" class="back-link">&larr; Tutti i pacchetti</button>

            <h1 id="det-nome" class="page-title" style="margin-top: 5px; margin-bottom: 5px; font-weight: 200; letter-spacing: 4px;"></h1>
            <p id="det-prezzo" style="text-align: center; color: var(--gold); font-size: 1.2rem; margin: 0;"></p>
            <p id="det-descrizione" class="detail-desc"></p>

            <p class="section-label" style="font-size: 0.7rem; letter-spacing: 2px;">COSA INCLUDE</p>
            <div id="det-servizi" style="margin-bottom: 30px;"></div>

            <form id="pacchettoForm">
                <p class="section-label" style="font-size: 0.7rem; letter-spacing: 2px;">Quando vorresti attivare il percorso?</p>
                <div class="input-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label style="color: #666; font-size: 0.7rem; text-transform: uppercase;">Data</label>
                        <input type="date" id="data" name="data" class="input-luxury" required>
                    </div>
                    <div>
                        <label style="color: #666; font-size: 0.7rem; text-transform: uppercase;">Orario Preferito</label>
                        <input type="time" id="orario" name="orario" class="input-luxury" required>
                    </div>
                </div>

                <div style="margin-top: 25px;">
                    <label style="color: #666; font-size: 0.7rem; text-transform: uppercase; margin-left: 5px;">Note (facoltative)</label>
                    <textarea id="note" name="note" class="textarea-luxury" rows="3"
                              placeholder="Vuoi dirci qualcosa in più?"></textarea>
                </div>

                <button type="submit" id="btnAttiva" class="main-btn" style="margin-top: 30px; padding: 18px; letter-spacing: 3px;">ATTIVA PACCHETTO</button>
                <p id="pacchettoMessage" class="auth-message" style="text-align: center; margin-top: 20px; font-size: 0.8rem; letter-spacing: 1px;"></p>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="pacchetti.js"></script>
</body>
</html>
