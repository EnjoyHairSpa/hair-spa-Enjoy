<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Area Riservata - Hair Spa</title>
    <link rel="icon" type="image/png" href="logo chiaro.png">
    
    <link rel="stylesheet" href="dark-luxury.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body.dark-page {
            background: url('lista.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
        }
        body.dark-page::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82);
            z-index: 0;
        }
        .form-container {
            position: relative;
            z-index: 1;
            padding: 25px;
            max-width: 500px;
            margin: 0 auto;
        }
        .hub-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.15);
            border-radius: 16px;
            padding: 22px 25px;
            margin-bottom: 18px;
            text-decoration: none;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .hub-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.05);
        }
        .hub-icon {
            font-size: 1.6rem;
            opacity: 0.85;
            width: 34px;
            text-align: center;
        }
        .hub-text {
            display: flex;
            flex-direction: column;
        }
        .hub-title {
            color: #fff;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .hub-subtitle {
            color: #888;
            font-size: 0.75rem;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="dark-page">

    <div class="form-container">
        <h1 class="page-title" style="margin: 20px 0 35px; font-weight: 200; letter-spacing: 6px; text-align:center; color:#fff;">
            AREA RISERVATA
        </h1>
<button id="btnAttivaNotifiche" style="display:block; margin: 15px auto; padding: 10px 20px; background: transparent; border: 1px solid #c5a059; color: #c5a059; border-radius: 20px; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;">🔔 Attiva Notifiche</button>
        <a href="appuntamenti.html" class="hub-card">
            <span class="hub-icon">📅</span>
            <span class="hub-text">
                <span class="hub-title">Appuntamenti</span>
                <span class="hub-subtitle">I tuoi rituali prenotati</span>
            </span>
        </a>

        <div id="hubCardInstallApp" class="hub-card" style="cursor:pointer; display:none;">
    <span class="hub-icon">📲</span>
    <span class="hub-text">
        <span class="hub-title">Installa l'app</span>
        <span class="hub-subtitle">Accesso rapido dalla Home</span>
    </span>
</div>

        <a href="il-mio-percorso.html" class="hub-card">
            <span class="hub-icon">✨</span>
            <span class="hub-text">
                <span class="hub-title">Il Mio Percorso</span>
                <span class="hub-subtitle">Percorsi e avanzamento</span>
            </span>
        </a>

        <a href="mio-account.html" class="hub-card">
            <span class="hub-icon">👤</span>
            <span class="hub-text">
                <span class="hub-title">Account</span>
                <span class="hub-subtitle">I tuoi dati personali</span>
            </span>
        </a>

        <a href="notifiche.html" class="hub-card">
    <span class="hub-icon">🔔</span>
    <span class="hub-text">
        <span class="hub-title">Notifiche</span>
        <span class="hub-subtitle">Dal tuo salone</span>
    </span>
</a>

    </div>
    <script src="config.js"></script>
    <script src="push-notifiche.js"></script>
    <script src="area-riservata.js"></script>
    <script src="bottom-nav.js"></script>
    <script src="install-button-area.js"></script>
</body>
</html>
