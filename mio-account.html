<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Account - Enjoy Bio Hair Spa</title>
    <link rel="stylesheet" href="dark-luxury.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">

<body class="dark-page">

<div class="form-container">
    <nav class="top-nav" style="position: relative; padding: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">

    <div style="text-align:center; margin-bottom: 15px;">
        <button id="btnModifica" style="padding: 8px 20px; background: transparent; border: 1px solid #c5a059; color: #c5a059; border-radius: 20px; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;">Modifica</button>
        <button id="btnSalva" style="display:none; padding: 8px 20px; background: #c5a059; border: 1px solid #c5a059; color: #000; border-radius: 20px; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;">Salva Modifiche</button>

    <div class="booking-card" id="account-data">
        <p class="booking-notes" style="text-align:center;">Caricamento dati...</p>
